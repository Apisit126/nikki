<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Shop System</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f6f8;
            color: #333;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        /* สินค้า (Product List) */
        .products-grid {
            flex: 2;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }
        .product-card {
            background: #fff;
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .product-card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        .product-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .product-price {
            color: #27ae60;
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 12px;
        }
        .btn-add {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-add:hover {
            background-color: #2980b9;
        }

        /* ตะกร้าสินค้า (Cart) */
        .cart-section {
            flex: 1;
            background: #fff;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            min-width: 300px;
            height: fit-content;
        }
        .cart-title {
            font-size: 1.3rem;
            margin-bottom: 15px;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }
        .cart-items {
            list-style: none;
            margin-bottom: 15px;
            max-height: 300px;
            overflow-y: auto;
        }
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px dashed #eee;
        }
        .btn-remove {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .cart-total {
            font-size: 1.2rem;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
            padding-top: 10px;
            border-top: 2px solid #eee;
        }
        .btn-checkout {
            width: 100%;
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 5px;
            margin-top: 15px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-checkout:hover {
            background-color: #27ae60;
        }
    </style>
</head>
<body>

    <header>
        <h1>🛍️️ ระบบร้านค้าออนไลน์ (Shop System)</h1>
    </header>

    <div class="container">
        <!-- โซนรายการสินค้า -->
        <div class="products-grid" id="productGrid"></div>

        <!-- โซนตะกร้าสินค้า -->
        <div class="cart-section">
            <h2 class="cart-title">🛒 ตะกร้าสินค้า</h2>
            <ul class="cart-items" id="cartItems">
                <li style="color: #888;">ไม่มีสินค้าในตะกร้า</li>
            </ul>
            <div class="cart-total">
                <span>ราคารวมทั้งหมด:</span>
                <span><span id="totalPrice">0</span> บาท</span>
            </div>
            <button class="btn-checkout" onclick="checkout()">สั่งซื้อสินค้า</button>
        </div>
    </div>

    <script>
        // ข้อมูลสินค้าตัวอย่าง
        const products = [
            { id: 1, name: "หูฟังไร้สาย", price: 1290, img: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=300" },
            { id: 2, name: "นาฬิกา Smartwatch", price: 2500, img: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=300" },
            { id: 3, name: "กล้องถ่ายรูป Retro", price: 8900, img: "https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?w=300" },
            { id: 4, name: "รองเท้าผ้าใบ", price: 1850, img: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=300" }
        ];

        let cart = [];

        // แสดงรายการสินค้า
        function renderProducts() {
            const productGrid = document.getElementById('productGrid');
            productGrid.innerHTML = products.map(product => `
                <div class="product-card">
                    <img src="${product.img}" alt="${product.name}">
                    <div class="product-title">${product.name}</div>
                    <div class="product-price">${product.price.toLocaleString()} บาท</div>
                    <button class="btn-add" onclick="addToCart(${product.id})">เพิ่มลงตะกร้า</button>
                </div>
            `).join('');
        }

        // เพิ่มสินค้าลงตะกร้า
        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            const cartItem = cart.find(item => item.id === productId);

            if (cartItem) {
                cartItem.quantity += 1;
            } else {
                cart.push({ ...product, quantity: 1 });
            }

            updateCartUI();
        }

        // ลบสินค้าออกจากตะกร้า
        function removeFromCart(productId) {
            cart = cart.filter(item => item.id !== productId);
            updateCartUI();
        }

        // อัปเดตหน้าตาของตะกร้าสินค้าและราคารวม
        function updateCartUI() {
            const cartItemsElement = document.getElementById('cartItems');
            const totalPriceElement = document.getElementById('totalPrice');

            if (cart.length === 0) {
                cartItemsElement.innerHTML = '<li style="color: #888;">ไม่มีสินค้าในตะกร้า</li>';
                totalPriceElement.innerText = "0";
                return;
            }

            cartItemsElement.innerHTML = cart.map(item => `
                <li class="cart-item">
                    <div>
                        <strong>${item.name}</strong><br>
                        <small>${item.price.toLocaleString()} x ${item.quantity}</small>
                    </div>
                    <div>
                        <button class="btn-remove" onclick="removeFromCart(${item.id})">ลบ</button>
                    </div>
                </li>
            `).join('');

            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            totalPriceElement.innerText = total.toLocaleString();
        }

        // ระบบสั่งซื้อแบบจำลอง
        function checkout() {
            if (cart.length === 0) {
                alert("กรุณาเลือกสินค้าก่อนสั่งซื้อ!");
                return;
            }
            alert("ขอบคุณสำหรับการสั่งซื้อ! ระบบได้รับรายการเรียบร้อยแล้ว");
            cart = [];
            updateCartUI();
        }

        // เริ่มต้นการทำงาน
        renderProducts();
    </script>
</body>
</html>
