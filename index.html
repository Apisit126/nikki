<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>วันนี้จะกินอะไรดี? - Pro Wheel Spinner</title>
    <!-- Google Fonts & Font Awesome -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- JS Canvas Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --bg-grad: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            --accent-gold: linear-gradient(135deg, #ffe57f 0%, #f59e0b 50%, #d97706 100%);
            --neon-pink: #f43f5e;
            --neon-purple: #a855f7;
            --card-glass: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.12);
            --text-light: #f8fafc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Kanit', sans-serif;
        }

        body {
            background: var(--bg-grad);
            background-attachment: fixed;
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        /* Header UI */
        header {
            text-align: center;
            padding: 2rem 1rem 1rem;
        }

        header h1 {
            font-size: 2.8rem;
            font-weight: 800;
            background: linear-gradient(to right, #fbbf24, #f43f5e, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 20px rgba(0,0,0,0.3);
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        header p {
            color: #94a3b8;
            font-size: 1.1rem;
            margin-top: 6px;
            font-weight: 300;
        }

        /* Main Container */
        .main-container {
            max-width: 1100px;
            width: 100%;
            margin: 1rem auto 2rem;
            padding: 0 1rem;
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 2rem;
            align-items: start;
        }

        @media (max-width: 900px) {
            .main-container {
                grid-template-columns: 1fr;
            }
            header h1 { font-size: 2.2rem; }
        }

        /* Pro Wheel Container */
        .wheel-card {
            background: var(--card-glass);
            backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            padding: 2.5rem 1.5rem;
            border-radius: 32px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 0 2px rgba(255,255,255,0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .wheel-outer-ring {
            position: relative;
            padding: 18px;
            border-radius: 50%;
            background: linear-gradient(145deg, #1e293b, #0f172a);
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.3), inset 0 0 15px rgba(0,0,0,0.8);
            border: 3px solid rgba(251, 191, 36, 0.4);
        }

        /* Lights decoration around wheel */
        .wheel-lights {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border-radius: 50%;
            pointer-events: none;
            box-sizing: border-box;
        }

        .wheel-container {
            position: relative;
            width: 360px;
            height: 360px;
        }

        @media (max-width: 440px) {
            .wheel-container {
                width: 280px;
                height: 280px;
            }
        }

        /* Pointer Marker */
        .pointer-box {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            filter: drop-shadow(0 6px 12px rgba(0,0,0,0.6));
        }

        .pointer-arrow {
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 38px solid #f59e0b;
            transition: transform 0.1s ease;
        }

        canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            transition: transform 4.5s cubic-bezier(0.12, 0.98, 0.15, 0.99);
        }

        /* Spin Button Styling */
        .btn-spin-container {
            margin-top: 2rem;
            position: relative;
        }

        .btn-spin {
            background: var(--accent-gold);
            color: #0f172a;
            border: none;
            padding: 16px 48px;
            font-size: 1.4rem;
            font-weight: 800;
            border-radius: 99px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(245, 158, 11, 0.5), 0 8px 0 #b45309;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            gap: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-spin:active {
            transform: translateY(6px);
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.4), 0 2px 0 #b45309;
        }

        .btn-spin:disabled {
            background: #475569;
            color: #94a3b8;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        /* Menu Panel UI */
        .menu-card {
            background: var(--card-glass);
            backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            padding: 1.8rem;
            border-radius: 32px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }

        .menu-card h3 {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 1.2rem;
            color: #f1f5f9;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .menu-badge {
            background: rgba(168, 85, 247, 0.2);
            color: #c084fc;
            padding: 4px 12px;
            border-radius: 99px;
            font-size: 0.85rem;
            border: 1px solid rgba(168, 85, 247, 0.3);
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 1.2rem;
        }

        .input-group input {
            flex: 1;
            padding: 12px 18px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            color: white;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s;
        }

        .input-group input:focus {
            border-color: var(--neon-purple);
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.3);
        }

        .btn-add {
            background: linear-gradient(135deg, var(--neon-purple), #7e22ce);
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-add:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }

        .menu-list {
            list-style: none;
            max-height: 300px;
            overflow-y: auto;
            padding-right: 6px;
        }

        .menu-list::-webkit-scrollbar {
            width: 5px;
        }
        .menu-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }

        .menu-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 10px;
            border-radius: 14px;
            font-size: 0.95rem;
            transition: all 0.2s;
        }

        .menu-item:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .btn-del {
            background: rgba(244, 63, 94, 0.15);
            border: none;
            color: var(--neon-pink);
            width: 30px;
            height: 30px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .btn-del:hover {
            background: var(--neon-pink);
            color: white;
        }

        /* Result Popup Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: linear-gradient(145deg, #1e293b, #0f172a);
            border: 2px solid rgba(251, 191, 36, 0.5);
            padding: 3rem 2.5rem;
            border-radius: 36px;
            text-align: center;
            max-width: 420px;
            width: 90%;
            transform: scale(0.7);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 0 50px rgba(251, 191, 36, 0.3);
        }

        .modal-overlay.active .modal-content {
            transform: scale(1);
        }

        .modal-icon {
            font-size: 3.5rem;
            margin-bottom: 1rem;
            background: var(--accent-gold);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .modal-content h2 {
            font-size: 1.2rem;
            color: #94a3b8;
            font-weight: 400;
        }

        .result-food {
            font-size: 2.3rem;
            font-weight: 800;
            color: #fbbf24;
            margin: 0.8rem 0 2rem;
            text-shadow: 0 0 20px rgba(251, 191, 36, 0.4);
        }

        .btn-close {
            background: var(--accent-gold);
            color: #0f172a;
            border: none;
            padding: 14px 36px;
            border-radius: 99px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 8px 20px rgba(245, 158, 11, 0.3);
        }

        .btn-close:hover {
            transform: scale(1.05);
        }

        footer {
            margin-top: auto;
            padding: 1.5rem;
            color: #64748b;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <header>
        <h1><i class="fa-solid fa-utensils"></i> วันนี้จะกินอะไรดี?</h1>
        <p>สุ่มเมนูอาหารด้วยวงล้อพรีเมียม สุ่มได้อะไรก็กินอันนั้นเลย!</p>
    </header>

    <div class="main-container">
        <!-- Wheel Card -->
        <div class="wheel-card">
            <div class="wheel-outer-ring">
                <div class="pointer-box">
                    <div class="pointer-arrow" id="pointerArrow"></div>
                </div>
                <div class="wheel-container">
                    <canvas id="wheelCanvas" width="600" height="600"></canvas>
                </div>
            </div>

            <div class="btn-spin-container">
                <button class="btn-spin" id="spinBtn" onclick="spinWheel()">
                    <i class="fa-solid fa-play"></i> หมุนวงล้อ!
                </button>
            </div>
        </div>

        <!-- Menu Panel -->
        <div class="menu-card">
            <h3>
                <span><i class="fa-solid fa-sliders"></i> รายการอาหาร</span>
                <span class="menu-badge" id="menuCount">0 เมนู</span>
            </h3>
            <div class="input-group">
                <input type="text" id="menuInput" placeholder="พิมพ์ชื่อเมนูอาหาร..." onkeypress="handleKeyPress(event)">
                <button class="btn-add" onclick="addMenu()">+ เพิ่ม</button>
            </div>
            <ul class="menu-list" id="menuList"></ul>
        </div>
    </div>

    <!-- Result Popup Modal -->
    <div class="modal-overlay" id="resultModal">
        <div class="modal-content">
            <div class="modal-icon"><i class="fa-solid fa-crown"></i></div>
            <h2>🎉 มื้อนี้ตัดสินใจได้แล้ว!</h2>
            <div class="result-food" id="resultText">ก๋วยเตี๋ยว</div>
            <button class="btn-close" onclick="closeModal()">จัดไป มื้อนี้กินนี่แหละ!</button>
        </div>
    </div>

    <footer>
        &copy; 2026 NIKKI Pro Wheel Randomizer — All Rights Reserved
    </footer>

    <script>
        let items = ["กระเพราไข่ดาว", "ชาบู / หมูกระทะ", "ก๋วยเตี๋ยว", "ส้มตำ ไก่ย่าง", "ข้าวมันไก่", "ข้าวไข่เจียว", "สเต๊กเนื้อ", "อาหารญี่ปุ่น"];

        // จานสีพรีเมียม Vibrant Neon
        const colors = [
            "#f43f5e", "#8b5cf6", "#06b6d4", "#10b981", 
            "#f59e0b", "#ec4899", "#3b82f6", "#84cc16"
        ];

        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        let currentRotation = 0;
        let isSpinning = false;

        // เสียงเอฟเฟกต์หมุนสไตล์ตู้เกม
        function playTickSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.03);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.03);
            } catch(e) {}
        }

        // วาดวงล้อ Pro HD
        function drawWheel() {
            const numItems = items.length;
            const arcSize = (2 * Math.PI) / numItems;
            const radius = canvas.width / 2;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (numItems === 0) {
                ctx.fillStyle = "#334155";
                ctx.beginPath();
                ctx.arc(radius, radius, radius, 0, 2 * Math.PI);
                ctx.fill();
                return;
            }

            for (let i = 0; i < numItems; i++) {
                const angle = i * arcSize;
                
                // วาดชิ้นวงล้อ
                ctx.fillStyle = colors[i % colors.length];
                ctx.beginPath();
                ctx.moveTo(radius, radius);
                ctx.arc(radius, radius, radius - 8, angle, angle + arcSize);
                ctx.fill();

                // เส้นขอบสีทองบางๆ
                ctx.lineWidth = 2;
                ctx.strokeStyle = "rgba(255, 255, 255, 0.2)";
                ctx.stroke();

                // วาดตัวหนังสือ
                ctx.save();
                ctx.translate(radius, radius);
                ctx.rotate(angle + arcSize / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 22px Kanit";
                ctx.shadowColor = "rgba(0,0,0,0.6)";
                ctx.shadowBlur = 6;
                ctx.fillText(items[i], radius - 45, 8);
                ctx.restore();
            }

            // วาดปุ่มดุมกลางวงล้อ (Center Hub)
            ctx.beginPath();
            ctx.arc(radius, radius, 45, 0, 2 * Math.PI);
            const grad = ctx.createLinearGradient(radius - 40, radius - 40, radius + 40, radius + 40);
            grad.addColorStop(0, '#fbbf24');
            grad.addColorStop(1, '#d97706');
            ctx.fillStyle = grad;
            ctx.fill();
            ctx.lineWidth = 4;
            ctx.strokeStyle = '#ffffff';
            ctx.stroke();
        }

        function updateMenuList() {
            const listEl = document.getElementById('menuList');
            document.getElementById('menuCount').innerText = `${items.length} เมนู`;

            listEl.innerHTML = items.map((item, index) => `
                <li class="menu-item">
                    <span>${item}</span>
                    <button class="btn-del" onclick="deleteMenu(${index})">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                </li>
            `).join('');

            drawWheel();
        }

        function addMenu() {
            const input = document.getElementById('menuInput');
            const val = input.value.trim();
            if (val) {
                items.push(val);
                input.value = '';
                updateMenuList();
            }
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') addMenu();
        }

        function deleteMenu(index) {
            if (items.length <= 2) {
                alert('ต้องเหลืออย่างน้อย 2 เมนูในวงล้อครับ!');
                return;
            }
            items.splice(index, 1);
            updateMenuList();
        }

        function spinWheel() {
            if (isSpinning || items.length === 0) return;

            isSpinning = true;
            document.getElementById('spinBtn').disabled = true;

            const extraDegrees = Math.floor(Math.random() * 360);
            const totalRotation = currentRotation + (360 * 6) + extraDegrees;
            currentRotation = totalRotation;

            // เอฟเฟกต์เสียงหมุนถี่ขนานกับการหมุน
            let soundInterval = setInterval(playTickSound, 120);

            // หมุนวงล้อ
            canvas.style.transform = `rotate(${totalRotation}deg)`;

            setTimeout(() => {
                clearInterval(soundInterval);
                isSpinning = false;
                document.getElementById('spinBtn').disabled = false;

                const actualDegree = totalRotation % 360;
                const arcSizeDegrees = 360 / items.length;
                const winningIndex = Math.floor((360 - (actualDegree % 360) + 270) % 360 / arcSizeDegrees);

                showResult(items[winningIndex]);
            }, 4500);
        }

        function showResult(result) {
            document.getElementById('resultText').innerText = result;
            document.getElementById('resultModal').classList.add('active');

            // เอฟเฟกต์ Confetti ฉลองชนะ
            confetti({
                particleCount: 120,
                spread: 80,
                origin: { y: 0.6 }
            });
        }

        function closeModal() {
            document.getElementById('resultModal').classList.remove('active');
        }

        updateMenuList();
    </script>
</body>
</html>
