<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>วันนี้จะกินอะไรดี? - วงล้อเสี่ยงทาย</title>
    <!-- Google Fonts & Font Awesome -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #ff6b6b;
            --primary-dark: #ee5253;
            --secondary: #feca57;
            --dark: #2d3436;
            --light: #f8efba;
            --bg: #f7f1e3;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Kanit', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            padding: 1.5rem 1rem 0.5rem;
        }

        header h1 {
            font-size: 2.2rem;
            color: var(--primary-dark);
            text-shadow: 2px 2px 0px #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        header p {
            color: #576574;
            font-size: 1rem;
            margin-top: 4px;
        }

        .main-container {
            max-width: 1100px;
            width: 100%;
            margin: 1rem auto;
            padding: 0 1rem;
            display: grid;
            grid-template-columns: 1fr 360px;
            gap: 2rem;
            align-items: start;
        }

        @media (max-width: 850px) {
            .main-container {
                grid-template-columns: 1fr;
            }
        }

        /* Wheel Section */
        .wheel-box {
            background: white;
            padding: 2rem 1rem;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .wheel-container {
            position: relative;
            width: 340px;
            height: 340px;
            margin: 1rem 0 2rem;
        }

        @media (max-width: 400px) {
            .wheel-container {
                width: 280px;
                height: 280px;
            }
        }

        /* Arrow Pointer */
        .pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 18px solid transparent;
            border-right: 18px solid transparent;
            border-top: 32px solid var(--primary-dark);
            z-index: 10;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.2));
        }

        canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            transition: transform 4s cubic-bezier(0.15, 0.99, 0.18, 0.99);
        }

        .btn-spin {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            border: none;
            padding: 14px 40px;
            font-size: 1.3rem;
            font-weight: 600;
            border-radius: 99px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(238, 82, 83, 0.4);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-spin:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 8px 25px rgba(238, 82, 83, 0.5);
        }

        .btn-spin:disabled {
            background: #c8d6e5;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        /* Menu Manager Section */
        .menu-card {
            background: white;
            padding: 1.5rem;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        .menu-card h3 {
            font-size: 1.2rem;
            margin-bottom: 1rem;
            color: var(--dark);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 1rem;
        }

        .input-group input {
            flex: 1;
            padding: 10px 14px;
            border: 2px solid #c8d6e5;
            border-radius: 12px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-group input:focus {
            border-color: var(--primary);
        }

        .btn-add {
            background: var(--dark);
            color: white;
            border: none;
            padding: 0 18px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-add:hover {
            background: #576574;
        }

        .menu-list {
            list-style: none;
            max-height: 280px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .menu-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            background: #f1f2f6;
            margin-bottom: 8px;
            border-radius: 10px;
            font-size: 0.95rem;
        }

        .btn-del {
            background: transparent;
            border: none;
            color: #ff4757;
            cursor: pointer;
            font-size: 1rem;
            transition: color 0.2s;
        }

        .btn-del:hover {
            color: #ff6b81;
        }

        /* Result Modal Overlay */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: white;
            padding: 2.5rem 2rem;
            border-radius: 24px;
            text-align: center;
            max-width: 360px;
            width: 90%;
            transform: scale(0.8);
            transition: transform 0.3s;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }

        .modal-overlay.active .modal-content {
            transform: scale(1);
        }

        .modal-content h2 {
            font-size: 1.2rem;
            color: #576574;
            margin-bottom: 0.5rem;
        }

        .result-food {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary-dark);
            margin: 1rem 0 1.5rem;
        }

        .btn-close {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }

        footer {
            margin-top: auto;
            padding: 1.5rem;
            color: #8395a7;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <header>
        <h1><i class="fa-solid fa-utensils"></i> วันนี้จะกินอะไรดี?</h1>
        <p>กดหมุนวงล้อสุ่มเมนูมื้อนี้ได้เลย!</p>
    </header>

    <div class="main-container">
        <!-- Wheel Area -->
        <div class="wheel-box">
            <div class="wheel-container">
                <div class="pointer"></div>
                <canvas id="wheelCanvas" width="500" height="500"></canvas>
            </div>
            <button class="btn-spin" id="spinBtn" onclick="spinWheel()">
                <i class="fa-solid fa-arrows-rotate"></i> หมุนวงล้อ
            </button>
        </div>

        <!-- Menu Management Area -->
        <div class="menu-card">
            <h3><i class="fa-solid fa-list-check"></i> รายการอาหาร (<span id="menuCount">0</span>)</h3>
            <div class="input-group">
                <input type="text" id="menuInput" placeholder="เพิ่มเมนูอาหาร..." onkeypress="handleKeyPress(event)">
                <button class="btn-add" onclick="addMenu()">เพิ่ม</button>
            </div>
            <ul class="menu-list" id="menuList"></ul>
        </div>
    </div>

    <!-- Result Popup Modal -->
    <div class="modal-overlay" id="resultModal">
        <div class="modal-content">
            <h2>🎉 มื้อนี้ขอเสนอ!</h2>
            <div class="result-food" id="resultText">ก๋วยเตี๋ยว</div>
            <button class="btn-close" onclick="closeModal()">ตกลง, กินเมนูนี้!</button>
        </div>
    </div>

    <footer>
        &copy; 2026 NIKKI Food Wheel Randomizer
    </footer>

    <script>
        // รายการเมนูเริ่มต้น
        let items = ["กระเพราไข่ดาว", "ชาบู / หมูกระทะ", "ก๋วยเตี๋ยว", "ส้มตำ ไก่ย่าง", "ข้าวมันไก่", "ข้าวไข่เจียว", "สเต๊ก", "อาหารญี่ปุ่น"];

        // จานสีสวยงามสำหรับวงล้อ
        const colors = [
            "#ff7675", "#fdcb6e", "#e17055", "#00b894", 
            "#0984e3", "#6c5ce7", "#e84393", "#00cec9"
        ];

        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        let currentRotation = 0;
        let isSpinning = false;

        // ระบบสร้างเสียงแบบสังเคราะห์ (ไม่ใช้ไฟล์ภายนอก)
        function playSpinSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.05);
            } catch(e) {}
        }

        // วาดวงล้อ
        function drawWheel() {
            const numItems = items.length;
            const arcSize = (2 * Math.PI) / numItems;
            const radius = canvas.width / 2;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (numItems === 0) {
                ctx.fillStyle = "#ccc";
                ctx.beginPath();
                ctx.arc(radius, radius, radius, 0, 2 * Math.PI);
                ctx.fill();
                return;
            }

            for (let i = 0; i < numItems; i++) {
                const angle = i * arcSize;
                
                // วาดชิ้นส่วนวงล้อ
                ctx.fillStyle = colors[i % colors.length];
                ctx.beginPath();
                ctx.moveTo(radius, radius);
                ctx.arc(radius, radius, radius, angle, angle + arcSize);
                ctx.fill();
                ctx.stroke();

                // วาดข้อความ
                ctx.save();
                ctx.translate(radius, radius);
                ctx.rotate(angle + arcSize / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 20px Kanit";
                ctx.shadowColor = "rgba(0,0,0,0.4)";
                ctx.shadowBlur = 4;
                ctx.fillText(items[i], radius - 30, 8);
                ctx.restore();
            }

            // วาดวงกลมตรงกลาง
            ctx.beginPath();
            ctx.arc(radius, radius, 40, 0, 2 * Math.PI);
            ctx.fillStyle = '#ffffff';
            ctx.fill();
            ctx.lineWidth = 4;
            ctx.strokeStyle = '#2d3436';
            ctx.stroke();
        }

        // อัปเดตรายการเมนูด้านข้าง
        function updateMenuList() {
            const listEl = document.getElementById('menuList');
            document.getElementById('menuCount').innerText = items.length;

            listEl.innerHTML = items.map((item, index) => `
                <li class="menu-item">
                    <span>${item}</span>
                    <button class="btn-del" onclick="deleteMenu(${index})">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                </li>
            `).join('');

            drawWheel();
        }

        // เพิ่มเมนู
        function addMenu() {
            const input = document.getElementById('menuInput');
            const val = input.value.trim();
            if (val) {
                items.push(val);
                input.value = '';
                updateMenuList();
            }
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') addMenu();
        }

        // ลบเมนู
        function deleteMenu(index) {
            if (items.length <= 2) {
                alert('ต้องมีอย่างน้อย 2 เมนูในวงล้อครับ!');
                return;
            }
            items.splice(index, 1);
            updateMenuList();
        }

        // ฟังก์ชันการหมุนวงล้อ
        function spinWheel() {
            if (isSpinning || items.length === 0) return;

            isSpinning = true;
            document.getElementById('spinBtn').disabled = true;

            // สุ่มรอบหมุน 5 ถึง 10 รอบ + มุมแบบสุ่ม
            const extraDegrees = Math.floor(Math.random() * 360);
            const totalRotation = currentRotation + (360 * 5) + extraDegrees;
            currentRotation = totalRotation;

            // เล่นเสียงระหว่างหมุน
            let soundInterval = setInterval(playSpinSound, 150);

            // หมุนด้วย CSS
            canvas.style.transform = `rotate(${totalRotation}deg)`;

            // เมื่อหมุนเสร็จ (4 วินาที)
            setTimeout(() => {
                clearInterval(soundInterval);
                isSpinning = false;
                document.getElementById('spinBtn').disabled = false;

                // คำนวณหาผลลัพธ์
                const actualDegree = totalRotation % 360;
                const arcSizeDegrees = 360 / items.length;
                // ปรับมุมให้อิงตามเข็มชี้ด้านบน (-90 องศา)
                const winningIndex = Math.floor((360 - (actualDegree % 360) + 270) % 360 / arcSizeDegrees);

                showResult(items[winningIndex]);
            }, 4000);
        }

        function showResult(result) {
            document.getElementById('resultText').innerText = result;
            document.getElementById('resultModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('resultModal').classList.remove('active');
        }

        // เริ่มต้นสร้างวงล้อ
        updateMenuList();
    </script>
</body>
</html>
