<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIKKI Premium Shop</title>
    <!-- Google Fonts & Font Awesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --secondary: #10b981;
            --secondary-hover: #059669;
            --dark: #0f172a;
            --light-bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #334155;
            --text-muted: #64748b;
            --danger: #ef4444;
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Kanit', sans-serif;
        }

        body {
            background-color: var(--light-bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Navbar */
        header {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            color: white;
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
        }

        .logo {
            font-size: 1.6rem;
            font-weight: 600;
            background: linear-gradient(135deg, #818cf8 0%, #c084fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .search-box {
            position: relative;
            flex: 1;
            max-width: 400px;
        }

        .search-box i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .search-box input {
            width: 100%;
            padding: 10px 16px 10px 42px;
            border-radius: 99px;
            border: 1px solid #334155;
            background: #1e293b;
            color: white;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s;
        }

        .search-box input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2);
        }

        /* Banner */
        .hero-banner {
            max-width: 1200px;
            margin: 1.5rem auto 0;
            padding: 0 1rem;
        }

        .banner-content {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            border-radius: var(--radius);
            padding: 2.5rem 2rem;
            color: white;
            box-shadow: 0 10px 30px rgba(79, 70, 229, 0.25);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .banner-text h1 {
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .banner-text p {
            opacity: 0.9;
            font-weight: 300;
        }

        /* Main Container */
        .main-container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
            display: grid;
            grid-template-columns: 1fr 360px;
            gap: 2rem;
            flex: 1;
            width: 100%;
        }

        @media (max-width: 968px) {
            .main-container {
                grid-template-columns: 1fr;
            }
            .banner-content {
                text-align: center;
                justify-content: center;
            }
        }

        .section-title {
            font-size: 1.4rem;
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 1.2rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Products Grid */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 1.5rem;
        }

        .product-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            border: 1px solid #f1f5f9;
        }

        .product-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        .img-container {
            position: relative;
            width: 100%;
            padding-top: 75%;
            overflow: hidden;
            background: #f1f5f9;
        }

        .img-container img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .product-card:hover .img-container img {
            transform: scale(1.08);
        }

        .product-info {
            padding: 1.2rem;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .product-name {
            font-weight: 500;
            font-size: 1.1rem;
            color: var(--dark);
            margin-bottom: 0.4rem;
        }

        .product-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 1.2rem;
            flex: 1;
            line-height: 1.4;
        }

        .product-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .product-price {
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--primary);
        }

        .btn-add {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-add:hover {
            background-color: var(--primary-hover);
            transform: scale(1.03);
        }

        /* Cart Section */
        .cart-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 1.5rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            position: sticky;
            top: 100px;
            border: 1px solid #f1f5f9;
        }

        .cart-header {
            font-size: 1.2rem;
            font-weight: 600;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 1rem;
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cart-badge {
            background: #e0e7ff;
            color: var(--primary);
            padding: 4px 12px;
            border-radius: 99px;
            font-size: 0.85rem;
        }

        .cart-items {
            list-style: none;
            max-height: 350px;
            overflow-y: auto;
            margin-bottom: 1.2rem;
            padding-right: 4px;
        }

        .cart-items::-webkit-scrollbar {
            width: 4px;
        }
        .cart-items::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.8rem 0;
            border-bottom: 1px dashed #e2e8f0;
        }

        .cart-item-info {
            flex: 1;
        }

        .cart-item-title {
            font-weight: 500;
            font-size: 0.95rem;
            color: var(--dark);
        }

        .cart-item-price {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        /* Quantity controls */
        .qty-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #f1f5f9;
            padding: 4px 8px;
            border-radius: 8px;
            margin-left: 10px;
        }

        .btn-qty {
            border: none;
            background: white;
            color: var(--dark);
            width: 22px;
            height: 22px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

        .btn-qty:hover {
            background: #e2e8f0;
        }

        .cart-total {
            border-top: 2px solid #f1f5f9;
            padding-top: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--dark);
        }

        .total-price {
            color: var(--danger);
            font-size: 1.4rem;
        }

        .btn-checkout {
            width: 100%;
            background-color: var(--secondary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            margin-top: 1.2rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-checkout:hover {
            background-color: var(--secondary-hover);
            transform: translateY(-2px);
        }

        .empty-cart {
            text-align: center;
            color: var(--text-muted);
            padding: 2.5rem 0;
        }

        .empty-cart i {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            color: #cbd5e1;
        }

        footer {
            text-align: center;
            padding: 1.5rem;
            background: var(--dark);
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-top: auto;
        }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <header>
        <div class="nav-container">
            <div class="logo">
                <i class="fa-solid fa-bag-shopping"></i> NIKKI Store
            </div>
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="ค้นหาสินค้าที่ต้องการ..." onkeyup="filterProducts()">
            </div>
        </div>
    </header>

    <!-- Hero Banner -->
    <div class="hero-banner">
        <div class="banner-content">
            <div class="banner-text">
                <h1>✨ โปรโมชันพิเศษต้อนรับเดือนนี้</h1>
                <p>เลือกซื้อสินค้าไอทีสุดพรีเมียม จัดส่งฟรีทุกรายการ!</p>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-container">
        <!-- Products Section -->
        <div>
            <div class="section-title">
                <i class="fa-solid fa-fire" style="color: #f59e0b;"></i> สินค้าแนะนำ
            </div>
            <div class="products-grid" id="productGrid"></div>
        </div>

        <!-- Cart Section -->
        <div>
            <div class="cart-card">
                <div class="cart-header">
                    <span><i class="fa-solid fa-cart-shopping"></i> ตะกร้าสินค้า</span>
                    <span class="cart-badge" id="cartCount">0 รายการ</span>
                </div>
                <ul class="cart-items" id="cartItems">
                    <div class="empty-cart">
                        <i class="fa-solid fa-cart-flatbed"></i>
                        <p>ไม่มีสินค้าในตะกร้า</p>
                    </div>
                </ul>
                <div class="cart-total">
                    <span>ราคารวมทั้งหมด:</span>
                    <span class="total-price"><span id="totalPrice">0</span> ฿</span>
                </div>
                <button class="btn-checkout" onclick="checkout()">
                    <i class="fa-solid fa-credit-card"></i> ชำระเงิน
                </button>
            </div>
        </div>
    </div>

    <footer>
        &copy; 2026 NIKKI Premium Shop — All Rights Reserved.
    </footer>

    <script>
        const products = [
            { id: 1, name: "หูฟัง Bluetooth ไร้สาย", price: 1290, desc: "ตัดเสียงรบกวน ANC ดีไซน์หรูหรา แบตอยู่นาน 24 ชม.", img: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500" },
            { id: 2, name: "นาฬิกา Smart Watch", price: 2500, desc: "หน้าจอ AMOLED วัดอัตราการเต้นหัวใจ กันน้ำ IP68", img: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500" },
            { id: 3, name: "กล้องสไตล์ Retro", price: 8900, desc: "เซนเซอร์คุณภาพสูง โทนสีคลาสสิก พกพาสะดวก", img: "https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?w=500" },
            { id: 4, name: "รองเท้าผ้าใบ Sneaker", price: 1850, desc: "นุ่มสบาย ระบายอากาศได้ดี เหมาะสำหรับใส่ออกกำลังกาย", img: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500" },
            { id: 5, name: "กระเป๋าเป้กันน้ำ", price: 1450, desc: "มีช่องใส่ Laptop 15 นิ้ว พร้อมช่องชาร์จ USB ด้านนอก", img: "https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=500" },
            { id: 6, name: "แก้วน้ำเก็บความเย็น", price: 490, desc: "สแตนเลส 304 เก็บความเย็นยาวนาน 18 ชั่วโมง", img: "https://images.unsplash.com/photo-1517256064527-09c73fc73e38?w=500" }
        ];

        let cart = [];

        function renderProducts(items = products) {
            const grid = document.getElementById('productGrid');
            if (items.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align:center; color:#94a3b8; padding:3rem 0;">ไม่พบสินค้าที่คุณค้นหา</p>';
                return;
            }

            grid.innerHTML = items.map(p => `
                <div class="product-card">
                    <div class="img-container">
                        <img src="${p.img}" alt="${p.name}">
                    </div>
                    <div class="product-info">
                        <div class="product-name">${p.name}</div>
                        <div class="product-desc">${p.desc}</div>
                        <div class="product-footer">
                            <span class="product-price">${p.price.toLocaleString()} ฿</span>
                            <button class="btn-add" onclick="addToCart(${p.id})">
                                <i class="fa-solid fa-plus"></i> เพิ่ม
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function filterProducts() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = products.filter(p => 
                p.name.toLowerCase().includes(query) || 
                p.desc.toLowerCase().includes(query)
            );
            renderProducts(filtered);
        }

        function addToCart(id) {
            const product = products.find(p => p.id === id);
            const existItem = cart.find(item => item.id === id);

            if (existItem) {
                existItem.qty += 1;
            } else {
                cart.push({ ...product, qty: 1 });
            }
            updateCartUI();
        }

        function changeQty(id, delta) {
            const item = cart.find(i => i.id === id);
            if (item) {
                item.qty += delta;
                if (item.qty <= 0) {
                    cart = cart.filter(i => i.id !== id);
                }
            }
            updateCartUI();
        }

        function updateCartUI() {
            const cartContainer = document.getElementById('cartItems');
            const totalPriceEl = document.getElementById('totalPrice');
            const cartCountEl = document.getElementById('cartCount');

            const totalQty = cart.reduce((sum, item) => sum + item.qty, 0);
            cartCountEl.innerText = `${totalQty} รายการ`;

            if (cart.length === 0) {
                cartContainer.innerHTML = `
                    <div class="empty-cart">
                        <i class="fa-solid fa-cart-flatbed"></i>
                        <p>ไม่มีสินค้าในตะกร้า</p>
                    </div>`;
                totalPriceEl.innerText = '0';
                return;
            }

            cartContainer.innerHTML = cart.map(item => `
                <li class="cart-item">
                    <div class="cart-item-info">
                        <div class="cart-item-title">${item.name}</div>
                        <div class="cart-item-price">${item.price.toLocaleString()} ฿</div>
                    </div>
                    <div class="qty-controls">
                        <button class="btn-qty" onclick="changeQty(${item.id}, -1)">-</button>
                        <span style="font-size:0.9rem; font-weight:600;">${item.qty}</span>
                        <button class="btn-qty" onclick="changeQty(${item.id}, 1)">+</button>
                    </div>
                </li>
            `).join('');

            const grandTotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            totalPriceEl.innerText = grandTotal.toLocaleString();
        }

        function checkout() {
            if (cart.length === 0) {
                alert('โปรดเลือกสินค้าลงตะกร้าก่อนทำการสั่งซื้อ!');
                return;
            }
            const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            alert(`🎉 สั่งซื้อสำเร็จ!\nขอบคุณที่ใช้บริการ ยอดชำระทั้งหมด: ${total.toLocaleString()} บาท`);
            cart = [];
            updateCartUI();
        }

        renderProducts();
    </script>
</body>
</html>
